<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Camera · TechCamp IDE</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./onnx-camera-window.css" />
  </head>
  <body class="onnx-camera-window-body">
    <main class="onnx-camera-window-shell" aria-labelledby="onnxWindowTitle">
      <header class="onnx-window-header">
        <div class="onnx-brand-lockup" aria-label="FPTU TechX Camp">
          <div class="onnx-techx-logo">FPTU TECH<span>X</span> CAMP</div>
          <span>FAIRINO SIMULATION</span>
        </div>
        <div class="onnx-window-title">
          <span class="onnx-window-kicker">LOCAL AI CAMERA</span>
          <h1 id="onnxWindowTitle">AI camera</h1>
        </div>
      </header>

      <div class="onnx-window-rule" aria-hidden="true"></div>

      <section
        class="panel onnx-camera-card onnx-camera-window-card"
        id="onnxCameraCard"
        aria-labelledby="onnxCameraTitle"
      >
        <div class="onnx-camera-heading">
          <div>
            <h2 id="onnxCameraTitle">Camera workspace</h2>
            <span class="onnx-status-chip" id="onnxProviderStatus">MODEL OFF</span>
          </div>
        </div>

        <div class="onnx-source-grid">
          <label class="onnx-field" for="onnxModelInput">
            <span>YOLO26-cls model (.onnx)</span>
            <input id="onnxModelInput" type="file" accept=".onnx,application/octet-stream" />
          </label>

          <label class="onnx-field" for="onnxCameraSelect">
            <span>Camera</span>
            <select id="onnxCameraSelect" disabled>
              <option value="">Connect to list cameras</option>
            </select>
          </label>
        </div>
        <p class="onnx-file-name" id="onnxModelName">Choose a local .onnx file</p>

        <div class="onnx-mode-group" role="group" aria-label="Camera drawing mode">
          <button class="button quiet" id="onnxCaptureModeBtn" type="button" aria-pressed="true">Capture frame</button>
          <button class="button quiet" id="onnxLiveModeBtn" type="button" aria-pressed="false">Draw live</button>
        </div>
        <p class="onnx-mode-help" id="onnxModeHelp">Capture mode · Predict all manually.</p>

        <div class="onnx-camera-stage" id="onnxCameraStage" data-mode="empty">
          <video id="onnxCameraVideo" muted playsinline hidden></video>
          <canvas id="onnxFrameCanvas" hidden></canvas>
          <canvas
            id="onnxOverlayCanvas"
            aria-label="Draw classification boxes on the selected frame. Press Enter to add a preset box in Capture frame mode."
            tabindex="0"
            hidden
          ></canvas>
          <p class="onnx-stage-empty" id="onnxStageEmpty">
            Connect a camera to begin.
          </p>
        </div>

        <div class="onnx-action-row onnx-camera-actions">
          <button class="button primary" id="onnxConnectCameraBtn" type="button">Connect camera</button>
          <button class="button quiet" id="onnxDisconnectBtn" type="button" disabled>Disconnect</button>
          <button class="button quiet" id="onnxCaptureBtn" type="button" disabled>Capture frame</button>
        </div>
        <div class="onnx-action-row onnx-region-actions">
          <button class="button quiet" id="onnxUndoBtn" type="button" disabled>Undo box</button>
          <button class="button quiet" id="onnxClearBtn" type="button" disabled>Clear boxes</button>
          <button class="button primary" id="onnxPredictBtn" type="button" disabled>Predict all</button>
        </div>

        <p class="onnx-status" id="onnxCameraStatus" role="status" aria-live="polite"></p>
        <ol class="onnx-results" id="onnxResults" aria-label="Classification results"></ol>
      </section>
    </main>
    <script type="module" src="./onnx-camera-window.mjs"></script>
  </body>
</html>
