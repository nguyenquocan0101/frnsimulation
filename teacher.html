<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TechX · Workshop submissions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Paytone+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./teacher.css" />
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="teacher-shell">
      <header class="teacher-header">
        <div>
          <div class="header-brand">
            <div class="techx-logo" aria-label="FPTU TechX Camp">FPTU TECH<span>X</span> CAMP</div>
            <span>FAIRINO SIMULATION</span>
          </div>
          <h1>TechX submissions</h1>
          <p>Workshop submissions</p>
        </div>
        <a class="button" href="./index.html">Simulator</a>
      </header>
      <section class="teacher-panel teacher-gate" id="teacherGate" aria-label="Teacher access">
        <label for="teacherPassword">Teacher password</label>
        <input id="teacherPassword" type="password" inputmode="numeric" maxlength="6" autocomplete="off" />
        <button class="button primary" id="teacherUnlockBtn" type="button">Unlock</button>
        <p id="teacherGateError" role="alert"></p>
      </section>
      <section class="teacher-panel" aria-label="Submission list">
        <div class="teacher-toolbar">
          <span
            class="public-status"
            id="teacherPublicStatus"
            data-status="loading"
            aria-live="polite"
            >Public workshop</span
          >
          <input
            class="teacher-filter"
            id="teacherFilter"
            type="search"
            placeholder="Filter by group…"
            aria-label="Filter by group"
          />
          <button
            class="button primary"
            id="teacherRefreshBtn"
            type="button"
            aria-label="Refresh submissions"
          >
            Refresh
          </button>
        </div>
        <p
          class="teacher-error"
          id="submissionError"
          data-status="error"
          aria-live="polite"
          hidden
        ></p>
        <span class="visually-hidden" data-status="ready">Ready</span>
        <p
          class="teacher-empty"
          id="submissionEmpty"
          data-status="empty"
          aria-live="polite"
          hidden
        >
          No submissions yet.
        </p>
        <div class="submission-table-wrap">
          <table class="submission-table" id="submissionTable">
            <thead>
              <tr>
                <th scope="col">No.</th>
                <th scope="col">Group</th>
                <th scope="col">File</th>
                <th scope="col">Submitted</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="submissionTableBody"></tbody>
          </table>
        </div>
        <dialog
          class="preview-dialog"
          id="previewDialog"
          aria-labelledby="previewTitle"
        >
          <form method="dialog">
            <div class="preview-header">
              <div>
                <p class="eyebrow">CODE PREVIEW</p>
                <h2 id="previewTitle">Code preview</h2>
              </div>
              <button
                class="button quiet"
                value="close"
                aria-label="Close preview"
              >
                Close
              </button>
            </div>
            <p class="preview-meta" id="previewMeta"></p>
            <pre class="preview-code"><code id="previewCode"></code></pre>
          </form>
        </dialog>
      </section>
    </main>
    <script type="module">
      import { createTeacherAccess, requireTeacherSession } from "./teacher-access.mjs";
      import { ONNX_API_BASE_URL } from "./onnx-submission-config.mjs";
      import {
        listSubmissions,
        downloadSubmission,
      } from "./firebase-public-client.mjs";
      import { initTeacherPortal } from "./teacher-submissions.mjs";
      const access = createTeacherAccess({ baseUrl: ONNX_API_BASE_URL });
      const gate = document.getElementById("teacherGate");
      const password = document.getElementById("teacherPassword");
      const unlock = document.getElementById("teacherUnlockBtn");
      const gateError = document.getElementById("teacherGateError");
      const bootTeacher = () => initTeacherPortal({
        list: listSubmissions,
        download: downloadSubmission,
        listModels: access.listModels,
        downloadModel: access.downloadModel,
        statusNode: document.getElementById("teacherPublicStatus"),
        rowsNode: document.getElementById("submissionTableBody"),
        filterInput: document.getElementById("teacherFilter"),
        refreshButton: document.getElementById("teacherRefreshBtn"),
        emptyNode: document.getElementById("submissionEmpty"),
        errorNode: document.getElementById("submissionError"),
        previewDialog: document.getElementById("previewDialog"),
        previewCode: document.getElementById("previewCode"),
        previewMeta: document.getElementById("previewMeta"),
        previewCloseButton: document.querySelector(
          "#previewDialog button[value=close]",
        ),
      });
      async function unlockTeacher() {
        gateError.textContent = "";
        try { await access.unlockTeacher(password.value); gate.hidden = true; bootTeacher(); }
        catch (error) { gateError.textContent = error.message; }
      }
      unlock.addEventListener("click", unlockTeacher);
      password.addEventListener("keydown", (event) => { if (event.key === "Enter") unlockTeacher(); });
      if (requireTeacherSession(access)) { gate.hidden = true; bootTeacher(); }

    </script>
  </body>
</html>
